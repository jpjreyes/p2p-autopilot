# Credentials never live here: the Databricks target reads them from the environment
# (DATABRICKS_HOST, DATABRICKS_HTTP_PATH, DATABRICKS_TOKEN), set by pipeline/run_dbt.sh from ~/.databrickscfg.
p2p:
  target: duckdb
  outputs:
    duckdb:
      type: duckdb
      path: "{{ env_var('P2P_DUCKDB', '../runs/data_layer/dbt.duckdb') }}"
      threads: 4
    databricks:
      type: databricks
      catalog: workspace
      schema: p2p_autopilot_dbt
      host: "{{ env_var('DATABRICKS_HOST', 'unset') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', 'unset') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', 'unset') }}"
      threads: 4
