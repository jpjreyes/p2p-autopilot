[project]
name = "p2p-autopilot"
version = "0.1.0"
description = "A computer-use agent that works supplier portals with no API and reconciles invoices, with a human approving every change"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "fpdf2>=2.8",
    "pydantic>=2.8",
    "pypdf>=5.0",
    "playwright>=1.64.1",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.2.4",
    "pillow>=13.0.0",
    "anthropic>=0.70",
    "pypdfium2>=5.15.2",
    "duckdb>=2.0.0",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "numpy>=2.5.4",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
    "google-cloud-storage>=3.17.1",
    "google-auth>=2.62.2",
    "requests>=2.34.2",
    "opentelemetry-exporter-gcp-trace>=1.15.0",
]

[dependency-groups]
dbt = [
    "dbt-core>=1.10,<1.11",
    "dbt-duckdb>=1.9.4",
    "dbt-databricks>=1.10",
]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]
mlops = [
    "databricks-sdk>=0.169.0",
    "evidently>=0.7",
    "mlflow>=3.5",
    "pandas<3",
]

[tool.uv]
# dbt-databricks pins an older databricks-sdk than MLflow needs: dbt runs in its own environment
conflicts = [[{ group = "dbt" }, { group = "mlops" }]]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/p2p_autopilot"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
