[project]
name = "p2p-autopilot"
version = "0.1.0"
description = "A computer-use agent that works supplier portals with no API and reconciles invoices, with a human approving every change"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "jinja2>=3.1",
    "itsdangerous>=2.2",
    "python-multipart>=0.0.9",
    "fpdf2>=2.8",
    "pydantic>=2.8",
    "pypdf>=5.0",
    "playwright>=1.64.1",
    "psycopg[binary,pool]>=3.2",
    "python-dotenv>=1.2.4",
    "pillow>=13.0.0",
    "anthropic>=0.70",
    "pypdfium2>=5.15.2",
    "duckdb>=2.0.0",
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "numpy>=2.5.4",
    "opentelemetry-sdk>=1.45.2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legacy_portal"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
