<!doctype html>
<html><head><meta charset="utf-8"><title>Keystone Electrical Supply - Customer Access</title>
<style>
body{font-family:Georgia,serif;background:#f4efe6;margin:0}
.bar{background:#3b2f2f;color:#f4efe6;padding:12px 24px;letter-spacing:1px}
.card{width:400px;margin:80px auto;background:#fff;padding:26px;border:1px solid #cbbfa8}
input{width:95%;padding:6px;margin-top:4px}.err{color:#a00}
</style></head>
<body>
<div class="bar">KEYSTONE ELECTRICAL SUPPLY · Customer Access</div>
<div class="card">
  <p><b>Step 2 of 2</b> · signing in as {{ user }}</p>
  {% if error %}<p class="err">{{ error }}</p>{% endif %}
  <form method="post" action="/d/login/password">
    <p>Password<br><input type="password" name="password" autocomplete="current-password"></p>
    {% if captcha %}<p style="background:#f6e3e3;padding:8px">Please confirm you are a person: drag the slider to
      the right.<br><input type="range" name="captcha" min="0" max="100" value="0"></p>{% endif %}
    <p><button type="submit">Sign in</button></p>
  </form>
</div>
</body></html>
