name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: lpa
          POSTGRES_PASSWORD: lpa
          POSTGRES_DB: lpa_p4
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lpa -d lpa_p4" --health-interval 2s --health-retries 30
    env:
      DATABASE_URL: postgresql://lpa:lpa@localhost:5432/lpa_p4
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run playwright install --with-deps chromium
      - run: uv run ruff check src tests data_layer
      - run: uv run python -m p2p_autopilot.process.warehouse  # real SAP log -> DuckDB (6 s), so the golden keys run
      - run: uv run python -m p2p_autopilot.process.predict --worklist  # score open invoices with the committed model
      - run: uv run pytest -q

  data-layer:
    runs-on: ubuntu-latest
    env:
      UV_PYTHON: "3.12"  # dbt 1.10 does not support Python 3.14 yet
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen --group dbt
      - name: Land the raw SAP extract, build it with dbt on DuckDB (models + tests)
        run: |
          uv run --group dbt python -m p2p_autopilot.data_layer.land --full
          uv run --group dbt dbt build --project-dir dbt --profiles-dir dbt
      - name: Parity with the original Python build (row-for-row fingerprints)
        run: uv run --group dbt python -m p2p_autopilot.data_layer.parity
      - name: Leak check (features built from data up to a cutoff must not change when later data lands)
        run: uv run --group dbt python -m p2p_autopilot.data_layer.leak_check

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the cloud image (warehouse, worklist and Chromium baked in)
        run: docker build -t p2p-autopilot:ci .
      - name: Smoke test the image
        run: |
          docker run --rm p2p-autopilot:ci python -c "
          from fastapi.testclient import TestClient
          from p2p_autopilot.process.api import router
          from fastapi import FastAPI
          app = FastAPI(); app.include_router(router)
          c = TestClient(app)
          o = c.get('/api/process/overview').json(); assert o['totals']['lines'] == 251734, o
          r = c.get('/api/process/risk?limit=1').json(); assert r['summary']['flagged'] > 0, r
          print('image ok', o['totals'], r['summary'])"
      - name: Terraform format and validate (no cloud credentials needed)
        run: |
          curl -fsSL https://releases.hashicorp.com/terraform/1.17.1/terraform_1.17.1_linux_amd64.zip -o tf.zip
          unzip -o -q tf.zip terraform -d /usr/local/bin
          terraform -chdir=infra/gcp fmt -check -recursive
          terraform -chdir=infra/gcp init -backend=false -input=false >/dev/null
          terraform -chdir=infra/gcp validate
